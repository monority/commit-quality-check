name: "Commit Quality Check"
description: "Run commit quality checks and generate reports for your repository"
author: "monority"
branding:
  icon: "check-circle"
  color: "green"

inputs:
  github-token:
    description: "Deprecated: PR annotations are emitted natively by the CLI (::warning/::notice). Kept for backward compatibility."
    required: false
    default: ${{ github.token }}
  profile:
    description: "Check profile: fast (default) or full"
    required: false
    default: "fast"
  config:
    description: "Path to commit-quality-check.yml config file"
    required: false
  reporters:
    description: "Output reporters: cli, json, sarif, markdown (comma-separated)"
    required: false
    default: "cli,sarif"
  output-dir:
    description: "Directory for report files"
    required: false
    default: "."
  upload-sarif:
    description: "Upload SARIF report to GitHub CodeQL (true/false)"
    required: false
    default: "false"

outputs:
  score:
    description: "Global quality score (0-100)"
  report-path:
    description: "Path to the generated report file"
  passed:
    description: "Whether all checks passed (true/false)"

runs:
  using: "composite"
  steps:
    - name: Install commit-quality-check
      run: npm install --save-dev commit-quality-check
      shell: bash

    - name: Run quality checks
      id: quality
      shell: bash
      env:
        CQ_CONFIG: ${{ inputs.config }}
        CQ_PROFILE: ${{ inputs.profile }}
        CQ_REPORTERS: ${{ inputs.reporters }}
        CQ_OUTPUT_DIR: ${{ inputs.output-dir }}
      run: |
        EXIT_CODE=0
        # CQ_CONFIG / CQ_REPORTERS / CQ_OUTPUT_DIR are read natively by cq.
        npx cq json-check --profile "$CQ_PROFILE" > cq-output.json || EXIT_CODE=$?
        SCORE=$(node -e "const d=require('./cq-output.json'); console.log(d.scoreSummary?.globalScore ?? 'N/A')" 2>/dev/null || echo "N/A")
        REPORT_PATH=$(node -e "const d=require('./cq-output.json'); console.log(d.reportPath || '')" 2>/dev/null || echo "")
        echo "score=$SCORE" >> $GITHUB_OUTPUT
        echo "report-path=$REPORT_PATH" >> $GITHUB_OUTPUT
        echo "passed=$([ "$SCORE" != "N/A" ] && [ "$SCORE" -ge 50 ] && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT
        exit $EXIT_CODE

    - name: Upload SARIF
      if: ${{ inputs.upload-sarif == 'true' }}
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ inputs.output-dir == '.' && 'report.sarif' || format('{0}/report.sarif', inputs.output-dir) }}
        category: commit-quality-check
