# .github/workflows/cq-analysis.yml
name: Commit Quality Analysis
on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run commit quality check
        run: npx -y --ignore-scripts commit-quality-check
        env:
          CQ_PROFILE: full
          CQ_REPORTERS: cli,sarif